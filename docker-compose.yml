services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookapi
      POSTGRES_PASSWORD: bookapi
      POSTGRES_DB: bookapi
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookapi"]
      interval: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8743"
      DATABASE_URL: postgres://bookapi:bookapi@db:5432/bookapi?sslmode=disable
      JWT_SECRET: local-dev-secret-local-dev-secret-123456
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "18743:8743"

volumes:
  pgdata:
