openapi: 3.0.3
info:
  title: Book API
  version: 1.0.0
  description: |
    Register or log in to get a token, then click **Authorize** and paste it.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: books

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: resource not found }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: validation failed }
        fields:
          type: object
          additionalProperties: { type: string }
          example: { email: must be a valid email address }
    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Asha }
        email: { type: string, example: asha@example.com }
        created_at: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Asha }
        email: { type: string, example: asha@example.com }
        password: { type: string, minLength: 8, example: supersecret }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: asha@example.com }
        password: { type: string, example: supersecret }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    BookInput:
      type: object
      required: [title, author]
      properties:
        title: { type: string, example: The Go Programming Language }
        author: { type: string, example: Donovan & Kernighan }
        isbn: { type: string, example: '9780134190440' }
        published_year: { type: integer, nullable: true, example: 2015 }
        description: { type: string, example: '' }
    Book:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          properties:
            id: { type: integer, format: int64, example: 1 }
            owner_id: { type: integer, format: int64, example: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    BookList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        total: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }

  parameters:
    BookID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    BadRequest:
      description: Invalid JSON or bad id
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, invalid or expired token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: You are not the owner
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }

paths:
  /healthz:
    get:
      tags: [health]
      summary: Is the server running?
      responses:
        '200': { description: OK }
  /readyz:
    get:
      tags: [health]
      summary: Is the database reachable?
      responses:
        '200': { description: Ready }
        '503': { description: Database unavailable }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
      responses:
        '201':
          description: Account created, you are logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already exists
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Validation' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '200':
          description: Logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Who am I?
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The logged-in user
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/books:
    get:
      tags: [books]
      summary: List books
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches title or author }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of books
          content: { application/json: { schema: { $ref: '#/components/schemas/BookList' } } }
    post:
      tags: [books]
      summary: Create a book
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BookInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookID'
    get:
      tags: [books]
      summary: Get one book
      responses:
        '200':
          description: The book
          content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [books]
      summary: Update a book (owner only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BookInput' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [books]
      summary: Delete a book (owner only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }