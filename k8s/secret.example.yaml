# Do not commit the real secret; create it with kubectl (see README) or use Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: book-api-secrets
  namespace: book-api
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgres://bookapi:CHANGE_ME@postgres:5432/bookapi?sslmode=disable
  JWT_SECRET: CHANGE_ME_TO_64_RANDOM_HEX_CHARS
