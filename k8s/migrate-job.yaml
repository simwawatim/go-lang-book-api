apiVersion: batch/v1
kind: Job
metadata:
  name: book-api-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: book-api
          command: ["./migrate", "up"]
          envFrom:
            - secretRef:
                name: book-api-secrets
